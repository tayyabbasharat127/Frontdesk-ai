services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      # Inside Docker, the database is reached by service name + internal port
      DATABASE_URL: postgresql+psycopg://frontdesk:frontdesk@postgres:5432/frontdesk
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
      POSTGRES_DB: frontdesk
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6381:6379"

volumes:
  pgdata: